<style>
  body{
  background:#0d0d25;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

.book{
  width:260px;
  height:180px;
  position:relative;
  perspective:1200px;
  cursor:pointer;
}

.cover{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#00ff66,#ccff00);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  color:#000;
  transform-origin:left;
  transition:transform 0.8s ease;
  border-radius:8px;
  z-index:2;
}

.content{
  position:absolute;
  width:100%;
  height:100%;
  background:#fff;
  padding:15px;
  box-sizing:border-box;
  border-radius:8px;
  z-index:1;
}

/* EFECTO LIBRO ABIERTO */
.book.open .cover{
  transform:rotateY(-160deg);
}

</style>

<div class="book" onclick="this.classList.toggle('open')">
  <div class="cover">
    <h2>JEKE</h2>
    <p>Ver info</p>
  </div>

  <div class="content">
    <h3>Predicción completa</h3>
    <p>
      • Equipo ganador
      • Probabilidad
      • Cuota
      • Análisis detallado
    </p>
  </div>
</div>
