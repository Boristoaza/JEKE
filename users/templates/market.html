
<div class="row g-4">
    {% for event in events %}
    <div class="col-12 col-md-6 col-lg-4">
        <div class="event-card h-100">
            <a href="{% url 'test' event.id %}" class="text-decoration-none text-reset d-block">
                <div class="event-header">
                    <span class="event-badge">{{ event.category }}</span>
                    <span class="event-close">
                        <i class="bi bi-clock-history me-1"></i> {{ event.close_date|date:"d M · H:i" }}
                    </span>
                </div>

                <div class="event-body">
                    <div class="event-title">{{ event.event_name }}</div>
                    <div class="event-vs">
                        <span>{{ event.first_name }}</span>
                        <span>VS</span>
                        <span>{{ event.second_name }}</span>
                    </div>
                    <p class="event-desc">
                        {{ event.description|truncatechars:65 }}
                    </p>
                </div>
            </a>

            <div class="event-actions">
                <form method="post" action="{% url 'bets:making_bet' %}">
                    {% csrf_token %}
                    <input type="hidden" name="event_id" value="{{ event.id }}">
                    <input type="hidden" name="choice" value="{{ event.first_name }}">
                    <button type="submit" class="bet-btn">
                        <span>{{ event.first_name|truncatechars:8 }}</span>
                    </button>
                </form>

                <form method="post" action="{% url 'bets:making_bet' %}">
                    {% csrf_token %}
                    <input type="hidden" name="event_id" value="{{ event.id }}">
                    <input type="hidden" name="choice" value="Empate">
                    <button type="submit" class="bet-btn">
                        <span>Empate</span>
                    </button>
                </form>

                <form method="post" action="{% url 'bets:making_bet' %}">
                    {% csrf_token %}
                    <input type="hidden" name="event_id" value="{{ event.id }}">
                    <input type="hidden" name="choice" value="{{ event.second_name }}">
                    <button type="submit" class="bet-btn">
                        <span>{{ event.second_name|truncatechars:8 }}</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
