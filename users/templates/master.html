<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JEKE - Plataforma de Apuestas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Kanit:wght@700;800&display=swap"
        rel="stylesheet">
        {% load static %}
        <link rel="stylesheet" href="{% static 'navbar.css' %}">
        <link rel="stylesheet" href="{% static 'hero.css' %}">
        <link rel="stylesheet" href="{% static 'details.css' %}">
        <link rel="stylesheet" href="{% static 'success.css' %}">



    <style>
        :root {
            --jeke-bg: #0f1115;
            /* Fondo ultra oscuro */
            --jeke-card: #1a1d23;
            /* Tarjetas y Navbar */
            --jeke-accent: #ccff00;
            /* Verde Neón - El color del dinero/apuestas */
            --jeke-text: #ffffff;
            --jeke-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--jeke-bg);
            color: var(--jeke-text);
            margin-top: 100px;
        }
    </style>
</head>

<body>

    {% include 'componets/navbar.html' %}

    {% block content %}

    {% include 'componets/hero.html' %}
    <div class="container-fluid">{% include 'componets/card.html' %}</div>
    {% endblock %}

    <footer style="margin-top: 6%;">{% include 'componets/footer.html' %}</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
