<style>
/* ================= JEKE PREMIUM CARD (HERO STYLE) ================= */
.event-card {
    background: rgba(255, 255, 255, 0.03); /* Fondo translúcido */
    backdrop-filter: blur(12px); /* Efecto cristal */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    padding: 0;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    height: 100%;
}

.event-card:hover {
    transform: translateY(-10px);
    border-color: #ccff00; /* Verde JEKE */
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 15px rgba(204, 255, 0, 0.1);
}

/* Resplandor interno */
.event-card::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(204, 255, 0, 0.04), transparent 40%);
    pointer-events: none;
}

/* HEADER */
.event-header {
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.event-badge {
    background: rgba(204, 255, 0, 0.1);
    color: #ccff00;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 8px;
    letter-spacing: 1px;
}

.event-time {
    color: #64748b;
    font-size: 11px;
    font-weight: 600;
}

/* BODY */
.event-body {
    padding: 30px 20px;
    text-align: center;
}

.event-subtitle {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 15px;
    display: block;
}

.event-vs-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
}

.team-name {
    font-family: 'Kanit', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #ffffff;
    flex: 1;
}

.vs-divider {
    color: #ccff00;
    font-family: 'Kanit', sans-serif;
    font-size: 0.9rem;
    background: rgba(204, 255, 0, 0.1);
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-style: italic;
}

/* ACTIONS (BOTONES DE APUESTA) */
.event-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px; /* Espacio entre botones */
    background: rgba(255, 255, 255, 0.05); /* Línea divisoria sutil */
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.bet-option {
    background: rgba(0, 0, 0, 0.2);
    border: none;
    padding: 15px 10px;
    color: #fff;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.bet-option:hover {
    background: #ccff00;
    color: #000;
}

.bet-label {
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.6;
}

.bet-option:hover .bet-label {
    opacity: 1;
}

.bet-value {
    font-family: 'Kanit', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
}
</style>


<div class="row g-4">
    {% for event in events %}
    <div class="col-12 col-md-6 col-lg-4">
        <div class="event-card">

            <div class="event-header">
                <span class="event-badge">{{ event.category }}</span>
                <span class="event-time">
                    <i class="bi bi-clock-history me-1"></i> {{ event.close_date|date:"H:i" }}
                </span>
            </div>

            <a href="{% url 'test' event.id %}" class="text-decoration-none">
                <div class="event-body">
                    <span class="event-subtitle" style="margin-bottom: 5px;">{{ event.event_name }}</span>

                    <div class="d-flex justify-content-center gap-3 mb-3">
                        <div class="text-center">
                            <small style="color: #94a3b8; font-size: 10px; display: block; text-transform: uppercase;">Retorno</small>
                            <span style="color: #ccff00; font-family: 'Kanit', sans-serif; font-size: 1.1rem; font-weight: 700;">+{{ event.profit }}%</span>
                        </div>
                        <div style="width: 1px; background: rgba(255,255,255,0.1); align-self: stretch;"></div>
                        <div class="text-center">
                            <small style="color: #94a3b8; font-size: 10px; display: block; text-transform: uppercase;">Mínimo</small>
                            <span style="color: #ffffff; font-family: 'Kanit', sans-serif; font-size: 1.1rem; font-weight: 700;">${{ event.min_bet_amount }}</span>
                        </div>
                    </div>

                    <div class="event-vs-container">
                        <div class="team-name text-end">{{ event.first_name }}</div>
                        <div class="vs-divider">VS</div>
                        <div class="team-name text-start">{{ event.second_name }}</div>
                    </div>
                </div>
            </a>

            <div class="event-actions">
                <form method="post" action="{% url 'bets:making_bet' %}" class="m-0">
                    {% csrf_token %}
                    <input type="hidden" name="event_id" value="{{ event.id }}">
                    <input type="hidden" name="choice" value="{{ event.first_name }}">
                    <button type="submit" class="bet-option w-100">
                        <span class="bet-label">Local</span>
                        <span class="bet-value">2.10</span>
                    </button>
                </form>

                <form method="post" action="{% url 'bets:making_bet' %}" class="m-0">
                    {% csrf_token %}
                    <input type="hidden" name="event_id" value="{{ event.id }}">
                    <input type="hidden" name="choice" value="Empate">
                    <button type="submit" class="bet-option w-100">
                        <span class="bet-label">Empate</span>
                        <span class="bet-value">3.40</span>
                    </button>
                </form>

                <form method="post" action="{% url 'bets:making_bet' %}" class="m-0">
                    {% csrf_token %}
                    <input type="hidden" name="event_id" value="{{ event.id }}">
                    <input type="hidden" name="choice" value="{{ event.second_name }}">
                    <button type="submit" class="bet-option w-100">
                        <span class="bet-label">Visita</span>
                        <span class="bet-value">1.85</span>
                    </button>
                </form>
            </div>

        </div>
    </div>
    {% endfor %}
</div>
